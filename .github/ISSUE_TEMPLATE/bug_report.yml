name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PocketBeat version
      description: Shown on the PocketBeat card in chrome://extensions
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 131 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: |
        Popup: right-click the popup → Inspect → Console.
        Service worker / player: chrome://extensions → PocketBeat → Inspect views.
      render: text
